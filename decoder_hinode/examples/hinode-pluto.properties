# Source configuration for PlutoPlus SDR (AD9361)
source.type=fmcomms2
source.uri=ip:192.168.3.1
source.frequency=2256220000
source.sample_rate=4000000
source.fpga_decimation=8
source.bandwidth=4000000
source.buffer_size=65536
source.block_samples=4096
source.gain1=manual
source.manual_gain1=32
source.filter_source=Off
source.quadrature=true
source.rfdc=true
source.bbdc=true
# Decoder configuration
decoder.type=hinode_s_tlm
# Initial jradio long-form DC blocker (length 16384); false bypasses exactly.
decoder.dcblocker=true
decoder.sample_rate_hz=500000
decoder.asm_errors=4
decoder.tap_capacity=16384

# Distribution configuration
distribution.frames.type=zmq
distribution.monitoring.type=zmq
# Flattened SatDecode network aliases are accepted; canonical distribution.* wins.
network.frames.endpoint=tcp://*:5555
network.frames.queue_capacity=4096
network.frames.send_hwm=4096
network.monitor.endpoint=tcp://*:5556
network.monitor.queue_capacity=256
network.monitor.send_hwm=256

# UI configuration
ui.enabled=true
