# Pluto Plus: PHY 4 MS/s / FPGA 4 = 1 MS/s delivered to the decoder.
# Signal 1693.000 MHz is -250 kHz relative to LO 1693.250 MHz.
# Runtime positive rotation shifts it to DC; no decoder RF translation.
source.type=fmcomms2
source.uri=ip:192.168.2.1
source.frequency=1693250000
source.sample_rate=4000000
source.fpga_decimation=4
source.output_frequency_offset=250000
source.bandwidth=1500000
source.buffer_size=32768
source.block_samples=4096
source.rx1_en=true
source.rx2_en=false
source.gain1=manual
source.manual_gain1=40
source.filter_source=Off
source.quadrature=true
source.rfdc=true
source.bbdc=true
source.recording.enabled=false

decoder.type=elektrol_ggak
decoder.sample_rate_hz=1000000
# A DC notch after runtime translation can attenuate the residual carrier.
decoder.dcblocker=false
decoder.tap_capacity=16384

distribution.frames.type=zmq
distribution.frames.decoder=elektrol_ggak
distribution.frames.receiver_id=receiver-1
distribution.frames.endpoint=tcp://*:5555
distribution.frames.queue_capacity=4096
distribution.frames.send_hwm=4096
distribution.frames.overflow_policy=FAIL_RUNTIME
distribution.monitoring.type=zmq
distribution.monitoring.decoder=elektrol_ggak
distribution.monitoring.receiver_id=receiver-1
distribution.monitoring.endpoint=tcp://*:5556
distribution.monitoring.queue_capacity=256
distribution.monitoring.send_hwm=256
ui.enabled=true
