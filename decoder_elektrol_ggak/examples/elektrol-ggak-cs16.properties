# Raw interleaved little-endian signed 16-bit I/Q at 1000000 complex samples/second.
# Signal and recording centre are both 1693.000 MHz; no source rotation is needed.
source.type=cs16
source.file=ElektroL_GGAK_1Msps.cs16
source.sample_rate=1000000
source.center_frequency=1693000000
source.output_frequency_offset=0
source.realtime=false
source.repeat=false
source.block_samples=4096

decoder.type=elektrol_ggak
decoder.sample_rate_hz=1000000
# Bypass preserves the GRC residual carrier at translated DC.
decoder.dcblocker=false
decoder.tap_capacity=16384

distribution.frames.type=synthetic
distribution.frames.queue_capacity=4096
distribution.frames.overflow_policy=FAIL_RUNTIME
distribution.monitoring.type=synthetic
ui.enabled=false
