# Run: java -jar target/jsatdecoder.jar --ui-demo --config examples/ui-demo.properties
# Synthetic monitoring, FFT spectra and QPSK symbols; no sample file, decoder or transport required.
ui.enabled=true
ui.refresh.status_hz=4
ui.refresh.quality_hz=8
ui.maximum_metrics=256
ui.maximum_text_characters=256
ui.tap_samples=1024
ui.fft.size=4096
ui.fft.window=HANN
ui.refresh.spectrum_hz=15
ui.refresh.baseband_hz=15
ui.refresh.constellation_hz=15
ui.constellation.points=1024
ui.constellation.history_frames=1
ui.constellation.scale_mode=AUTO
ui.constellation.scale=1.5
ui.constellation.reference=QPSK
ui.spectrum.average_alpha=1
ui.spectrum.floor_db=-140
ui.spectrum.ceiling_db=80
ui.spectrum.maximum_columns=2048
# Optional explicit RF center; otherwise use source monitoring metadata:
# ui.spectrum.rf_center_frequency_hz=137100000
ui.quality.alpha=0.25
ui.quality.unusable_snr_db=-5
ui.quality.poor_snr_db=0
ui.quality.fair_snr_db=5
ui.quality.good_snr_db=10
ui.quality.excellent_snr_db=15
ui.width=1180
ui.height=800
