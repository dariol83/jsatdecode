# Native IIOD network example. Dummy emits integration records, not telemetry.
source.type=fmcomms2
source.uri=ip:192.168.2.1
source.frequency=2400000000
source.sample_rate=3000000
# PHY rate above; delivered rate = sample_rate / fpga_decimation.
# For 500 ksps on supporting FPGA firmware: sample_rate=4000000, fpga_decimation=8.
source.fpga_decimation=1
source.bandwidth=2000000
source.buffer_size=65536
source.block_samples=4096
# Optional source IQ recording; missing folder defaults to Java user.home.
source.recording.enabled=false
# source.recording.folder=C:/recordings/iq
# source.recording.name=my-pass
# source.recording.queue_mib=64
# source.recording.write_buffer_mib=4
# source.recording.failure_policy=STOP_RECORDING
source.rx1_en=true
source.rx2_en=false
source.gain1=manual
source.manual_gain1=45
source.rf_port_select=A_BALANCED
source.quadrature=true
source.rfdc=true
source.bbdc=true
source.filter_source=Off
source.kernel_buffers=4
source.connect_timeout_ms=5000
source.server_timeout_ms=3000
source.read_timeout_ms=5000
decoder.type=dummy
distribution.frames.type=synthetic
distribution.frames.queue_capacity=4096
distribution.frames.overflow_policy=FAIL_RUNTIME
distribution.monitoring.type=synthetic
ui.enabled=false
